version: '3.9'

services:
  db:
    image: pgvector/pgvector:pg15
    platform: linux/amd64 # add this
    container_name: cv_backend_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-cv_db}
    ports:
      - "127.0.0.1:5432:5432" # Securely bind to localhost only (accessible by host migrations / tools)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cv_backend_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # Securely bind to localhost only (accessible by host cache / worker)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cv_backend_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ${INSIGHTFACE_CACHE_DIR:-~/.insightface}:/root/.insightface
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-cv_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: cv_backend_worker
    restart: unless-stopped
    command: celery -A workers.celery worker --loglevel=info --concurrency=1
    volumes:
      - .:/app
      - ${INSIGHTFACE_CACHE_DIR:-~/.insightface}:/root/.insightface
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-cv_db}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
